name: Android CI

on:
  push:
    branches:
      - main
      - ota

jobs:

  # 🔥 OTA JOB
  ota:
    if: github.ref == 'refs/heads/ota'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true   # ✅ important for push

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable

      # ✅ FIX 1: Clean + stable install
      - name: Clean Yarn Cache
        run: yarn cache clean

      - name: Install deps
        run: yarn install --frozen-lockfile

      # ✅ Bundle
      - name: Build OTA Bundle
        run: |
          npx react-native bundle \
          --platform android \
          --dev false \
          --entry-file index.js \
          --bundle-output dist/index.android.bundle \
          --assets-dest dist

      # ✅ ZIP
      - name: Zip OTA
        run: |
          cd dist
          zip -r ota.zip .

      # ✅ FIX 2: Push with safety
      - name: Commit OTA
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@bot.com"
          git add dist
          git commit -m "OTA update" || echo "No changes"
          git push origin ota

  # 🔥 BUILD JOB
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable

      # ✅ same fix here
      - name: Clean Yarn Cache
        run: yarn cache clean

      - name: Install deps
        run: yarn install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/release.keystore

      - name: Build AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab