name: Android Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-upload-key.keystore

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          # Gradle ko memory limit exceed karne se bachane ke liye environment variables
          ./gradlew assembleRelease \
            -PMAVEN_USERNAME=${{ secrets.MAVEN_USERNAME }} \
            -PMAVEN_PASSWORD=${{ secrets.MAVEN_PASSWORD }} \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vwi-play-apk
          path: android/app/build/outputs/apk/release/app-release.apk
