name: Android CI

on:
  push:
    branches:
      - main
      - ota

jobs:
  # 🔥 OTA JOB
  ota:
    if: github.ref == 'refs/heads/ota'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn' # ✅ Built-in stable caching

      - run: corepack enable

      - name: Install dependencies
        # --network-concurrency 1 use karne se corruption ke chances khatam ho jate hain
        run: yarn install --frozen-lockfile --network-concurrency 1

      - name: Build OTA Bundle
        run: |
          mkdir -p dist
          npx react-native bundle \
          --platform android \
          --dev false \
          --entry-file index.js \
          --bundle-output dist/index.android.bundle \
          --assets-dest dist

      - name: Zip OTA
        run: |
          cd dist
          zip -r ota.zip .

      - name: Commit OTA
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore: OTA update [skip ci]" || echo "No changes to commit"
          git push origin ota

  # 🔥 BUILD JOB
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn' # ✅ Enable caching here too

      - run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-concurrency 1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/release.keystore

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab